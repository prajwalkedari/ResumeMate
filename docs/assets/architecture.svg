<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">ResumeMate architecture</title>
  <desc id="d">The ResumeMate website sends versioned messages through the bridge client and window.postMessage to the ResumeMate Assistant extension. The extension validates each message and reviews it with the user. Submission to the Gemini web app is designed but not yet verified live.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93C5FD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="300" rx="14" fill="#0F172A"/>

  <!-- Website -->
  <rect x="24" y="70" width="200" height="150" rx="12" fill="url(#g1)"/>
  <text x="124" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">ResumeMate website</text>
  <text x="124" y="134" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#DDD6FE">Next.js 14 App Router</text>
  <text x="124" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#DDD6FE">/create · /generate</text>
  <text x="124" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#DDD6FE">/preview · /extension</text>
  <text x="124" y="206" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#C4B5FD">Works without the extension</text>

  <!-- Bridge -->
  <rect x="262" y="70" width="200" height="150" rx="12" fill="url(#g3)"/>
  <text x="362" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Bridge client</text>
  <text x="362" y="134" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#CFFAFE">lib/extension-bridge.ts</text>
  <text x="362" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#CFFAFE">channel resumemate-web · v1</text>
  <text x="362" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#CFFAFE">request IDs · timeouts · origin checks</text>
  <text x="362" y="206" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#A5F3FC">Serializes resume data only on user action</text>

  <!-- Extension -->
  <rect x="500" y="70" width="200" height="150" rx="12" fill="url(#g2)"/>
  <text x="600" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Assistant extension</text>
  <text x="600" y="134" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#DBEAFE">Manifest V3</text>
  <text x="600" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#DBEAFE">validates sender, origin, size</text>
  <text x="600" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#DBEAFE">user reviews before any send</text>
  <text x="600" y="206" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#93C5FD">Returns output only after review</text>

  <!-- Gemini -->
  <rect x="738" y="70" width="198" height="150" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="837" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#F5F3FF">Gemini web app</text>
  <text x="837" y="134" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#CBD5E1">gemini.google.com</text>
  <text x="837" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#CBD5E1">user's own signed-in tab</text>
  <text x="837" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#CBD5E1">no private APIs or cookies</text>
  <text x="837" y="206" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#A78BFA">Live path not yet verified</text>

  <!-- Arrows website -> bridge -> extension -->
  <line x1="226" y1="130" x2="258" y2="130" stroke="#93C5FD" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="464" y1="130" x2="496" y2="130" stroke="#93C5FD" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- return path -->
  <line x1="496" y1="160" x2="464" y2="160" stroke="#67E8F9" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="258" y1="160" x2="226" y2="160" stroke="#67E8F9" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- extension -> gemini -->
  <line x1="704" y1="145" x2="734" y2="145" stroke="#A78BFA" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <text x="242" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#93C5FD">PREPARE</text>
  <text x="480" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#93C5FD">_PROMPT</text>
  <text x="242" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#67E8F9">RETURN_OUTPUT</text>
  <text x="480" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#67E8F9">ERROR</text>
  <text x="721" y="136" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#C4B5FD">send after</text>
  <text x="721" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#C4B5FD">confirmation</text>

  <!-- Footer -->
  <text x="480" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#E2E8F0">Resume data is never sent during the HELLO handshake.</text>
  <text x="480" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94A3B8">Protocol and generation flow checked with fixture tests. The live Gemini step and the deployed site are not verified.</text>
</svg>
